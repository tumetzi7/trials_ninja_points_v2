<style>
/* Layout: a race-timing board. One narrow column, a sticky header with the view switch, dense ranked tables underneath. */
:root {
  --bg: #eef0f4;
  --surface: #ffffff;
  --surface-2: #f6f7fa;
  --fg: #141821;
  --muted: #5f6677;
  --line: #dde1e9;
  --accent: #b85d00;
  --accent-soft: #fbead6;
  --gold: #a57800;
  --silver: #6f7a8c;
  --bronze: #9a5a2c;

  --r-bronze: #a5622f;
  --r-silver: #7c8799;
  --r-gold: #b58900;
  --r-plat: #1f9488;
  --r-diamond: #2f74d0;
  --r-champ: #7d43c9;
  --r-gc: #c0327e;
  --r-ssl: #c24a00;

  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1119; --surface: #151b26; --surface-2: #1b2230; --fg: #e9ecf2; --muted: #8e97a9; --line: #263042;
    --accent: #ffad33; --accent-soft: #3a2a12; --gold: #f2c14e; --silver: #c3cad6; --bronze: #d99361;
    --r-bronze: #d18a55; --r-silver: #aeb8c8; --r-gold: #e8bb3a; --r-plat: #4fd1c1; --r-diamond: #6aa8ff; --r-champ: #b48bff; --r-gc: #ff6fb8; --r-ssl: #ffad33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1119; --surface: #151b26; --surface-2: #1b2230; --fg: #e9ecf2; --muted: #8e97a9; --line: #263042;
  --accent: #ffad33; --accent-soft: #3a2a12; --gold: #f2c14e; --silver: #c3cad6; --bronze: #d99361;
  --r-bronze: #d18a55; --r-silver: #aeb8c8; --r-gold: #e8bb3a; --r-plat: #4fd1c1; --r-diamond: #6aa8ff; --r-champ: #b48bff; --r-gc: #ff6fb8; --r-ssl: #ffad33;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.wrap {
  max-width: 960px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Masthead */
.mast { padding-block: 28px 18px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 24px; }
.mast h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 6vw, 52px);
  line-height: .9; letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance;
}
.mast h1 span { color: var(--accent); }
.mast .sub { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stat { display: grid; gap: 2px; }
.stat b { font-family: var(--font-data); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }

/* Sticky bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 10px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg a {
  text-decoration: none; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted);
  white-space: nowrap; transition: background .15s, color .15s;
}
.seg a:hover { color: var(--fg); }
.seg a[aria-current="page"] { background: var(--fg); color: var(--bg); }
.search {
  flex: 1 1 180px; min-width: 0; display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
}
.search svg { flex: none; color: var(--muted); }
.search input { border: 0; background: transparent; outline: none; width: 100%; min-width: 0; font-size: 14px; }
.search:focus-within { border-color: var(--accent); }

main { padding-block: 18px 56px; }

/* Section head */
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
.head h2 { margin: 0; font-family: var(--font-display); font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: .01em; }
.head p { margin: 0; color: var(--muted); font-size: 14px; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600;
  color: var(--muted); cursor: pointer;
}
.chipbtn:hover { color: var(--fg); }
.chipbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Podium */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.pod {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px;
  text-decoration: none; position: relative; overflow: hidden; min-width: 0;
}
.pod:hover { border-color: var(--pc); }
.pod::after { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--pc); }
.pod .pos { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; color: var(--pc); }
.pod .nm { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod .el { font-family: var(--font-data); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pod .el small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.p1 { --pc: var(--gold); } .p2 { --pc: var(--silver); } .p3 { --pc: var(--bronze); }

/* Tables */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th {
  text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap;
}
td { padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-2); }
.num { text-align: right; font-family: var(--font-data); font-size: 14px; }
th.num { font-family: var(--font-body); }
.pos { width: 1%; font-family: var(--font-data); color: var(--muted); }
.pos.top1 { color: var(--gold); font-weight: 600; } .pos.top2 { color: var(--silver); font-weight: 600; } .pos.top3 { color: var(--bronze); font-weight: 600; }
.dim td { color: var(--muted); }
.name { font-weight: 600; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.lnk { text-decoration: none; border-bottom: 1px solid transparent; }
.lnk:hover { border-bottom-color: currentColor; color: var(--accent); }
.trk { color: var(--fg); }
.trk .lvl { color: var(--muted); font-family: var(--font-data); font-size: 12px; margin-left: 6px; }

.elo { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
.elo .meter { width: 90px; height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.elo .meter i { display: block; height: 100%; background: var(--rc, var(--accent)); }
.elo b { font-weight: 600; min-width: 4ch; text-align: right; }

.rank {
  --rc: var(--muted);
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 12px; font-weight: 600;
  color: color-mix(in srgb, var(--rc) 78%, var(--fg)); background: color-mix(in srgb, var(--rc) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--rc) 35%, transparent);
}
.rank::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--rc); transform: rotate(45deg); }
.r-Bronze { --rc: var(--r-bronze); } .r-Silver { --rc: var(--r-silver); } .r-Gold { --rc: var(--r-gold); } .r-Platinum { --rc: var(--r-plat); }
.r-Diamond { --rc: var(--r-diamond); } .r-Champ { --rc: var(--r-champ); } .r-Grand-Champ { --rc: var(--r-gc); } .r-SSL { --rc: var(--r-ssl); }
.prov { font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 1px 7px; margin-left: 6px; font-weight: 500; }

.flt { font-family: var(--font-data); }
.flt.zero {
  display: inline-block; font-weight: 600; color: var(--accent); background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 4px; padding: 0 7px;
}
.pts { font-weight: 600; }

.more { display: flex; justify-content: center; padding: 14px; border-top: 1px solid var(--line); }
.btn {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 18px; font-weight: 600; font-size: 14px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }

.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

/* Detail pages */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; margin-bottom: 14px; }
.back:hover { color: var(--accent); }
.hero { display: grid; gap: 14px; margin-bottom: 16px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.hero h2 {
  margin: 4px 0 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 6vw, 48px); line-height: .95;
  text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere;
}
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.fact { background: var(--surface); padding: 12px 14px; display: grid; gap: 3px; min-width: 0; }
.fact small { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.fact b { font-family: var(--font-data); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fact b.txt { font-family: var(--font-body); font-size: 16px; }
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.lv { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.lv-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lv-top > span { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lv-top b { font-family: var(--font-data); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.lv-top b span { color: var(--muted); font-weight: 500; font-size: 14px; }
.lv-bar { height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.lv-bar i { display: block; height: 100%; background: var(--accent); }
.lv.full { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.note { color: var(--muted); font-size: 13px; margin: 12px 2px 0; }

footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; }
footer p { margin: 0; max-width: 65ch; }

@media (max-width: 640px) {
  .hide-sm { display: none; }
  .elo .meter { display: none; }
  .podium { grid-template-columns: 1fr; }
  .pod { grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 10px 14px; }
  .pod .pos { font-size: 24px; }
  .pod .el { font-size: 18px; }
  .name { max-width: 150px; }
  td, th { padding-left: 9px; padding-right: 9px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtInt = n => n.toLocaleString("en-US");
  const fmtTime = ms => {
    const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60, r = ms % 1000;
    return `${m}:${String(s).padStart(2, "0")}.${String(r).padStart(3, "0")}`;
  };
  const ord = n => { const v = n % 100; return n + (["th", "st", "nd", "rd"][(v - 20) % 10] || ["th", "st", "nd", "rd"][v] || "th"); };
  const posClass = n => n <= 3 ? ` top${n}` : "";

  // Slugs for hash routing: ASCII letters, digits and hyphens only
  const used = new Set();
  const slugify = (prefix, s) => {
    let base = prefix + "-" + (s.normalize("NFKD").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase() || "x");
    let slug = base, i = 2;
    while (used.has(slug)) slug = base + "-" + i++;
    used.add(slug);
    return slug;
  };

  // Tracks
  const tkey = (t, l) => t + "\u0000" + l;
  const tracks = new Map();
  D.tracks.forEach(t => tracks.set(tkey(t.Track, t.Level), { ...t, slug: slugify("t", `${t.Track} ${t.Level}`), runs: [] }));
  D.runs.forEach(r => {
    const k = tkey(r.Track, r.Level);
    if (!tracks.has(k)) tracks.set(k, { Track: r.Track, Level: r.Level, VoteCount: 0, Rating: r.Level, slug: slugify("t", `${r.Track} ${r.Level}`), runs: [] });
    const t = tracks.get(k);
    t.runs.push(r);
    r.t = t;
  });
  tracks.forEach(t => {
    t.runs.sort((a, b) => a.Faults - b.Faults || a.Time - b.Time);
    t.runs.forEach((r, i) => { r.trackPos = i + 1; });
    const f = t.runs.map(r => r.Faults);
    t.median = f.length ? (f.length % 2 ? f[(f.length - 1) / 2] : (f[f.length / 2 - 1] + f[f.length / 2]) / 2) : null;
  });
  const trackList = [...tracks.values()].filter(t => t.runs.length).sort((a, b) => b.Rating - a.Rating || a.Track.localeCompare(b.Track));
  const trackBySlug = new Map(trackList.map(t => [t.slug, t]));
  const levelTotals = {};
  trackList.forEach(t => { levelTotals[t.Level] = (levelTotals[t.Level] || 0) + 1; });
  const levelsDesc = Object.keys(levelTotals).map(Number).sort((a, b) => b - a);

  // Players
  const players = D.players.map(p => ({ ...p, slug: slugify("p", p.Player), runs: [] }));
  const playerByName = new Map(players.map(p => [p.Player, p]));
  const playerBySlug = new Map(players.map(p => [p.slug, p]));
  D.runs.forEach(r => { const p = playerByName.get(r.Player); if (p) { p.runs.push(r); r.p = p; } });
  players.forEach(p => p.runs.sort((a, b) => b.Points - a.Points));

  const allRuns = [...D.runs].sort((a, b) => b.Points - a.Points);
  allRuns.forEach((r, i) => { r.overall = i + 1; });
  const maxElo = Math.max(...players.map(p => p.Elo));
  const ranked = players.filter(p => p.Ranked).length;

  $("#updated").textContent = "updated " + new Date(D.generated + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  $("#stats").innerHTML = [
    [ranked, "ranked players"], [allRuns.length, "runs"], [trackList.length, "tracks"]
  ].map(([n, l]) => `<div class="stat"><b>${fmtInt(n)}</b><small>${l}</small></div>`).join("");

  // Pieces
  const rankChip = r => `<span class="rank r-${esc(r.replace(/ /g, "-"))}">${esc(r)}</span>`;
  const pLink = p => p ? `<a class="lnk" href="#${p.slug}">${esc(p.Player)}</a>` : "";
  const tLink = t => `<a class="lnk trk" href="#${t.slug}">${esc(t.Track)}<span class="lvl">L${t.Level}</span></a>`;
  const faults = f => `<span class="flt${f === 0 ? " zero" : ""}"${f === 0 ? ' title="Zero faults"' : ""}>${f}</span>`;

  // State
  const state = { q: "", unranked: true, runsShown: 100, levels: new Set(), trackLimit: {} };
  try { const s = JSON.parse(localStorage.getItem("np-prefs") || "{}"); if (typeof s.unranked === "boolean") state.unranked = s.unranked; } catch (e) {}
  const savePrefs = () => { try { localStorage.setItem("np-prefs", JSON.stringify({ unranked: state.unranked })); } catch (e) {} };
  const match = (...fields) => !state.q || fields.some(f => f.toLowerCase().includes(state.q));
  let lastList = "players";

  // Views
  function viewPlayers() {
    const list = players.filter(p => (state.unranked || p.Ranked) && match(p.Player));
    const top3 = !state.q ? players.filter(p => p.Ranked).slice(0, 3) : [];
    const body = list.map(p => `
      <tr class="${p.Ranked ? "" : "dim"}">
        <td class="pos${p.Ranked ? posClass(p.Place) : ""}">${p.Ranked ? p.Place : "&ndash;"}</td>
        <td class="name">${pLink(p)}${p.Ranked ? "" : '<span class="prov">unranked</span>'}</td>
        <td>${rankChip(p.Rank)}</td>
        <td class="num"><div class="elo r-${esc(p.Rank.replace(/ /g, "-"))}"><span class="meter"><i style="width:${(p.Elo / maxElo * 100).toFixed(1)}%"></i></span><b>${fmtInt(p.Elo)}</b></div></td>
        <td class="num hide-sm">${p.Level.toFixed(2)}</td>
        <td class="num hide-sm">${p.Runs}</td>
      </tr>`).join("");
    return `
      <div class="head">
        <div><h2>Player Elo</h2><p>${ranked} ranked, ${players.length - ranked} unranked</p></div>
        <div class="toggles"><button class="chipbtn" id="tg-unranked" aria-pressed="${state.unranked}">Show unranked</button></div>
      </div>
      ${top3.length ? `<div class="podium">${top3.map((p, i) => `
        <a class="pod p${i + 1}" href="#${p.slug}">
          <span class="pos">${ord(i + 1)}</span>
          <span class="nm">${esc(p.Player)}</span>
          <span class="el">${fmtInt(p.Elo)}<small>Elo</small></span>
        </a>`).join("")}</div>` : ""}
      <div class="card"><div class="scroll"><table>
        <thead><tr><th>#</th><th>Player</th><th>Rank</th><th class="num">Elo</th><th class="num hide-sm">Level</th><th class="num hide-sm">Runs</th></tr></thead>
        <tbody>${body || `<tr><td colspan="6" class="empty">No players match &ldquo;${esc(state.q)}&rdquo;.</td></tr>`}</tbody>
      </table></div></div>`;
  }

  function viewRuns() {
    const list = allRuns.filter(r => match(r.Player, r.Track));
    const shown = list.slice(0, state.runsShown);
    const body = shown.map(r => `
      <tr>
        <td class="pos${posClass(r.overall)}">${r.overall}</td>
        <td class="name">${pLink(r.p) || esc(r.Player)}</td>
        <td>${tLink(r.t)}</td>
        <td class="num">${faults(r.Faults)}</td>
        <td class="num hide-sm">${fmtTime(r.Time)}</td>
        <td class="num pts">${fmtInt(r.Points)}</td>
      </tr>`).join("");
    const left = list.length - shown.length;
    return `
      <div class="head">
        <div><h2>Top runs</h2><p>Every run, ranked by points</p></div>
      </div>
      <div class="card"><div class="scroll"><table>
        <thead><tr><th>#</th><th>Player</th><th>Track</th><th class="num">Faults</th><th class="num hide-sm">Time</th><th class="num">Points</th></tr></thead>
        <tbody>${body || `<tr><td colspan="6" class="empty">No runs match &ldquo;${esc(state.q)}&rdquo;.</td></tr>`}</tbody>
      </table></div>
      ${left > 0 ? `<div class="more"><button class="btn" id="more-runs">Show ${fmtInt(Math.min(left, 100))} more <span style="color:var(--muted);font-weight:500">of ${fmtInt(left)}</span></button><button class="btn" id="all-runs" style="margin-left:8px">Show all</button></div>` : ""}
      </div>`;
  }

  function viewTracks() {
    const lv = [...new Set(trackList.map(t => t.Level))].sort((a, b) => b - a);
    const list = trackList.filter(t => (!state.levels.size || state.levels.has(t.Level)) && match(t.Track));
    const body = list.map(t => {
      const rec = t.runs[0];
      return `<tr>
        <td>${tLink(t)}</td>
        <td class="num">${t.Rating.toFixed(2)}</td>
        <td class="num hide-sm">${t.VoteCount || "&ndash;"}</td>
        <td class="num">${t.runs.length}</td>
        <td class="name hide-sm">${pLink(rec.p) || esc(rec.Player)}</td>
        <td class="num">${faults(rec.Faults)}</td>
      </tr>`;
    }).join("");
    return `
      <div class="head">
        <div><h2>Tracks</h2><p>Hardest first, by rating</p></div>
        <div class="toggles">${lv.map(l => `<button class="chipbtn" data-level="${l}" aria-pressed="${state.levels.has(l)}">Level ${l}</button>`).join("")}</div>
      </div>
      <div class="card"><div class="scroll"><table>
        <thead><tr><th>Track</th><th class="num">Rating</th><th class="num hide-sm">Votes</th><th class="num">Passes</th><th class="hide-sm">Record holder</th><th class="num">Best</th></tr></thead>
        <tbody>${body || `<tr><td colspan="6" class="empty">No tracks match.</td></tr>`}</tbody>
      </table></div></div>`;
  }

  function viewTrack(t) {
    const list = t.runs.filter(r => match(r.Player));
    const body = list.map(r => `
      <tr>
        <td class="pos${posClass(r.trackPos)}">${r.trackPos}</td>
        <td class="name">${pLink(r.p) || esc(r.Player)}</td>
        <td class="num">${faults(r.Faults)}</td>
        <td class="num">${fmtTime(r.Time)}</td>
        <td class="num hide-sm">${r.RunLevel.toFixed(2)}</td>
        <td class="num pts">${fmtInt(r.Points)}</td>
      </tr>`).join("");
    const rec = t.runs[0];
    const fastest = t.runs.reduce((a, b) => b.Time < a.Time ? b : a);
    return `
      <a class="back" href="#${lastList}">&larr; Back to ${lastList === "runs" ? "top runs" : lastList}</a>
      <section class="hero">
        <div><div class="eyebrow">Ninja level ${t.Level} track</div><h2>${esc(t.Track)}</h2></div>
        <div class="facts">
          <div class="fact"><small>Rating</small><b>${t.Rating.toFixed(2)}</b></div>
          <div class="fact"><small>Votes</small><b>${t.VoteCount || "None"}</b></div>
          <div class="fact"><small>Passes</small><b>${t.runs.length}</b></div>
          <div class="fact"><small>Median faults</small><b>${t.median}</b></div>
          <div class="fact"><small>Fastest</small><b>${fmtTime(fastest.Time)}</b></div>
          <div class="fact"><small>Record</small><b class="txt">${esc(rec.Player)}</b></div>
        </div>
      </section>
      <div class="card"><div class="scroll"><table>
        <thead><tr><th>#</th><th>Player</th><th class="num">Faults</th><th class="num">Time</th><th class="num hide-sm">Run level</th><th class="num">Points</th></tr></thead>
        <tbody>${body || `<tr><td colspan="6" class="empty">No runs by &ldquo;${esc(state.q)}&rdquo; on this track.</td></tr>`}</tbody>
      </table></div></div>
      ${t.VoteCount ? "" : `<p class="note">Nobody has voted on this track yet, so it counts at its flat level of ${t.Level}.</p>`}`;
  }

  function viewPlayer(p) {
    const list = p.runs.filter(r => match(r.Track));
    const records = p.runs.filter(r => r.trackPos === 1).length;
    const flawless = p.runs.filter(r => r.Faults === 0).length;
    const body = list.map(r => `
      <tr>
        <td>${tLink(r.t)}</td>
        <td class="num">${faults(r.Faults)}</td>
        <td class="num hide-sm">${fmtTime(r.Time)}</td>
        <td class="num">${ord(r.trackPos)}<span style="color:var(--muted)"> / ${r.t.runs.length}</span></td>
        <td class="num pts">${fmtInt(r.Points)}</td>
      </tr>`).join("");
    return `
      <a class="back" href="#${lastList}">&larr; Back to ${lastList === "runs" ? "top runs" : lastList}</a>
      <section class="hero">
        <div><div class="eyebrow">${p.Ranked ? `${ord(p.Place)} place` : `Unranked &middot; needs 7 runs`}</div><h2>${esc(p.Player)}</h2></div>
        <div class="facts">
          <div class="fact"><small>Elo</small><b>${fmtInt(p.Elo)}</b></div>
          <div class="fact"><small>Rank</small><b class="txt">${rankChip(p.Rank)}</b></div>
          <div class="fact"><small>Level</small><b>${p.Level.toFixed(2)}</b></div>
          <div class="fact"><small>Runs</small><b>${p.Runs}</b></div>
          <div class="fact"><small>Track records</small><b>${records}</b></div>
          <div class="fact"><small>0f runs</small><b>${flawless}</b></div>
        </div>
        <div class="levels">${levelsDesc.map(l => {
          const done = new Set(p.runs.filter(r => r.Level === l).map(r => r.Track)).size, total = levelTotals[l];
          return `<div class="lv${done === total ? " full" : ""}">
            <div class="lv-top"><span>Level ${l}s</span><b>${done}<span>/${total}</span></b></div>
            <div class="lv-bar"><i style="width:${(done / total * 100).toFixed(1)}%"></i></div>
          </div>`;
        }).join("")}</div>
      </section>
      <div class="card"><div class="scroll"><table>
        <thead><tr><th>Track</th><th class="num">Faults</th><th class="num hide-sm">Time</th><th class="num">Place</th><th class="num">Points</th></tr></thead>
        <tbody>${body || `<tr><td colspan="5" class="empty">No runs match &ldquo;${esc(state.q)}&rdquo;.</td></tr>`}</tbody>
      </table></div></div>`;
  }

  // Router
  function current() {
    const h = location.hash.slice(1);
    if (h === "runs" || h === "tracks" || h === "players") return { view: h };
    if (trackBySlug.has(h)) return { view: "track", t: trackBySlug.get(h) };
    if (playerBySlug.has(h)) return { view: "player", p: playerBySlug.get(h) };
    return { view: "players" };
  }
  let prevKey = null;
  function render() {
    const c = current();
    const key = location.hash;
    if (["players", "runs", "tracks"].includes(c.view)) lastList = c.view;
    document.querySelectorAll(".seg a").forEach(a => a.setAttribute("aria-current", a.dataset.view === (["track", "player"].includes(c.view) ? lastList : c.view) ? "page" : "false"));
    const html = c.view === "runs" ? viewRuns() : c.view === "tracks" ? viewTracks() : c.view === "track" ? viewTrack(c.t) : c.view === "player" ? viewPlayer(c.p) : viewPlayers();
    $("#app").innerHTML = html;
    const q = $("#q");
    q.placeholder = c.view === "track" ? "Search players on this track" : c.view === "player" ? "Search this player's tracks" : c.view === "tracks" ? "Search tracks" : "Search players or tracks";
    if (key !== prevKey && prevKey !== null) window.scrollTo({ top: 0 });
    prevKey = key;
  }

  $("#q").addEventListener("input", e => { state.q = e.target.value.trim().toLowerCase(); state.runsShown = 100; render(); });
  window.addEventListener("hashchange", () => { state.q = ""; $("#q").value = ""; state.runsShown = 100; render(); });
  $("#app").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.id === "tg-unranked") { state.unranked = !state.unranked; savePrefs(); render(); }
    else if (b.id === "more-runs") { state.runsShown += 100; render(); }
    else if (b.id === "all-runs") { state.runsShown = Infinity; render(); }
    else if (b.dataset.level) { const l = +b.dataset.level; state.levels.has(l) ? state.levels.delete(l) : state.levels.add(l); render(); }
  });

  render();
})();
</script>
</body>
</html>
